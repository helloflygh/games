<!DOCTYPE html>
<style>
  .button {
    /* Color and Text Styles */
    background-color: #0000FF; /* Blue background */
    color: #FFFFFF;           /* White text */
    text-decoration: none;    /* Removes default underline from link */
    padding: 10px 20px;       /* Adds space inside the button */
    border-radius: 5px;       /* Rounds the corners slightly */

    /* Centering Styles */
    display: block;           /* Makes the link fill its container width */
    margin: 0 auto;           /* Auto margins horizontally center the block element */
    width: fit-content;       /* Shrinks the width to fit the content (alternative to specific width) */
    text-align: center;       /* Centers the text inside the button */
}
</style>
<html>
  <a href="https://blooket-freedom-infinite.b-cdn.net/" target="_blank" class="button">Launch this app</a>
</html>
